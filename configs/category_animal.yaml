# Category experiment, condition 1: fine-tune subject 1 on ONE category.
#
# Everything (model, optimiser, epochs, batch, learning rate, test set) is identical to
# configs/main.yaml; only the training trials differ. Run the stages one at a time:
#
#   python -m mindeye_lora.cli assets     --config configs/category_animal.yaml
#   python -m mindeye_lora.cli precompute --config configs/category_animal.yaml
#   python -m mindeye_lora.cli train      --config configs/category_animal.yaml
#   python -m mindeye_lora.cli predict    --config configs/category_animal.yaml
#   python -m mindeye_lora.cli evaluate   --config configs/category_animal.yaml
#
# (not run-all: its compare/report stages compare arms *within* this config, and this
# config has one arm. Comparing against the session-1 baseline is the next step.)
#
# Data files and runs are named with the training set's tag,
# cat-animal-only-700-first-s0, so nothing from the session-1 experiment is overwritten.

subj: 1
num_sessions: 1
pretrain: multisubject_1024
average_test_repeats: true
zscore_voxels: true

# The only change from configs/main.yaml: WHICH trials are trained on. Instead of
# session 1's 688 trials (mixed images), 700 different animal-only images drawn from
# all 40 sessions, one trial (the first viewing) each. See `cli categories` for the
# counts and src/mindeye_lora/trainsets.py for how they are chosen.
train_set:
  kind: category
  category: animal
  rule: only            # animals and nothing else in the cropped image
  n_images: 700
  viewing: first
  selection_seed: 0

use_prior: true
blurry_recon: false
upstream_ref: main
clip_backend: open_clip

epochs: 150
# batch_size x grad_accum = 24, matching the paper's effective batch. Split this way
# because the diffusion prior's attention allocates a [batch, 32 heads, 257, 257]
# similarity matrix per layer, which OOMs a T4 at batch 24 regardless of arm.
batch_size: 6
grad_accum: 4
lr: 3.0e-4            # paper's max_lr for full fine-tuning; PEFT arms override below
weight_decay: 1.0e-2
mixup_pct: 0.33
prior_scale: 30.0
clip_scale: 1.0
max_grad_norm: 1.0
precision: fp16
# 8-bit moments are required for the full arm on a 16 GB card: at 729M parameters,
# fp32 AdamW needs ~11.7 GB for params + grads + moments alone. Applied to EVERY arm,
# since using it for one would confound the comparison with an optimiser change.
optimizer: adamw8bit
num_workers: 2
warmup_pct: 0.02

seeds: [0]            # start light; add 1 and 2 if the result is interesting
eval_every: 10
save_every_min: 10.0
time_budget_min: 150   # stop cleanly before a free-tier session is reclaimed

recon_decoder: none    # switch to sdxl_unclip once you have disk for the 18 GB decoder
recon_n_images: 100
recon_seed: 0
qualitative_n: 8
qualitative_arms: 3
retrieval_fallback: true
retrieval_k: 3


arms:
  # Same arm, settings and learning rate as lora_r16 in configs/main.yaml, so the result
  # is compared with your existing session-1 run subj01_1sess_lora_r16_seed0.
  - name: lora_r16
    mode: lora
    lora_r: 16
    lora_alpha: 32
    lr: 1.0e-3
    label: "LoRA r=16 (animal-only training set)"
